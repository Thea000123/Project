<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - FOOT Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <style>
    /* ── Page header & toggle (shared with Medium.html) ── */
    .page-header {
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-top: 30px; margin-bottom: 40px;
    }
    .back-btn {
      position: absolute; left: 0; font-size: 24px; cursor: pointer;
      color: #1a1a1a; text-decoration: none; transition: color .15s; line-height: 1;
    }
    .back-btn:hover { color: #0369a1; }
    .page-title { font-family: 'Times New Roman',Times,serif; font-size: 28px; font-weight: normal; }
    .toggle-wrapper { display: flex; gap: 20px; margin-bottom: 40px; }
    .toggle-btn {
      flex: 1; padding: 20px; text-align: center; background-color: #f0f0f0;
      border-radius: 8px; font-family: 'Times New Roman',Times,serif; font-size: 20px;
      transition: background .3s; text-decoration: none; color: inherit; display: block;
    }
    .toggle-btn.active { background-color: #c0e6fa; }
    .toggle-btn:hover:not(.active) { background-color: #e4e4e4; }
    /* ── Categories grid ── */
    .categories-main { padding: 40px 0 80px; }
    .categories-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .categories-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .cat-card {
      border: 1px solid #dcdcdc; border-radius: 12px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 260px; gap: 10px; transition: transform .2s, box-shadow .2s;
      cursor: pointer; position: relative; overflow: hidden; background: #fff;
    }
    .cat-card:not(.disabled):hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
    .cat-card.disabled { cursor: default; opacity: 0.7; }
    .cat-card img { max-width: 100%; height: 160px; object-fit: contain; transition: transform .3s; }
    .cat-card:not(.disabled):hover img { transform: scale(1.05); }
    .card-title { font-family: 'Times New Roman',Times,serif; font-size: 17px; margin-top: 10px; text-align: center; color: #1a1a1a; }
    /* Responsive */
    @media (max-width: 768px) {
      .categories-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }
    @media (max-width: 480px) {
      .categories-container { padding: 0 14px; }
      .toggle-wrapper { gap: 12px; }
      .toggle-btn { padding: 14px 12px; font-size: 16px; }
      .cat-card { min-height: 200px; }
      .cat-card img { height: 110px; }
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <main class="categories-main">
    <div class="categories-container">
      <header class="page-header">
        <a href="index.html" class="back-btn" aria-label="Back to home">←</a>
        <h1 class="page-title">Categories</h1>
      </header>

      <nav class="toggle-wrapper" aria-label="Browse mode">
        <a href="Categories.html" class="toggle-btn active" aria-current="page">Categories</a>
        <a href="Medium.html" class="toggle-btn">Medium</a>
      </nav>

      <section class="categories-grid" aria-label="Product categories">
        <article class="cat-card" data-href="page1-marine.html">
          <img src="../images/image 17.png" alt="Marine Life">
          <div class="card-title">Marine Life</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 29.png" alt="Newest Work">
          <div class="card-title">Newest Work</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 18.png" alt="Gift Gallery">
          <div class="card-title">Gift Gallery</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 19.png" alt="Contemporary">
          <div class="card-title">Contemporary</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 20.png" alt="Humans and Aliens">
          <div class="card-title">Humans and Aliens</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 27.png" alt="Wall Reliefs">
          <div class="card-title">Wall Reliefs</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 28.png" alt="Jewellery">
          <div class="card-title">Jewellery</div>
        </article>
        <article class="cat-card disabled">
          <img src="../images/image 30.png" alt="Land Animals">
          <div class="card-title">Land Animals</div>
        </article>
      </section>
    </div>
  </main>

  <div id="shared-footer"></div>

  <script src="../js/cart.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/shared.js"></script>
  <script>
    document.querySelectorAll('.cat-card:not(.disabled)').forEach(card => {
      const href = card.dataset.href;
      if (href) {
        card.addEventListener('click', () => window.location.href = href);
        card.setAttribute('role', 'link');
        card.setAttribute('tabindex', '0');
        card.addEventListener('keydown', e => { if (e.key === 'Enter') window.location.href = href; });
      }
    });
  </script>
</body>
</html>
