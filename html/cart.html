<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — Foot's Artworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
  <style>
    .cart-page { background: linear-gradient(180deg, #fff 0%, #e8f4fb 100%); min-height: calc(100vh - 64px); padding: 2rem 1.5rem 4rem; }
    .cart-container { max-width: 1100px; margin: 0 auto; }
    .cart-back { display: inline-flex; align-items: center; gap: 6px; color: #334155; font-size: 14px; font-weight: 500; text-decoration: none; margin-bottom: 1.5rem; padding: 6px 10px; border-radius: 6px; transition: background .15s, color .15s; }
    .cart-back:hover { background: rgba(0,0,0,.05); color: #1e293b; }
    .cart-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #0f172a; margin-bottom: 2rem; }
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 2rem; align-items: start; }
    .cart-items { background: #fff; border-radius: 20px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
    .cart-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #f1f5f9; }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-img { width: 100px; height: 100px; border-radius: 12px; background: #f8fafc; padding: 12px; flex-shrink: 0; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: contain; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .cart-item-subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .cart-item-price { font-size: 16px; font-weight: 600; color: #0f172a; }
    .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .cart-qty-control { display: flex; align-items: center; border: 1.5px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .cart-qty-btn { background: none; border: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #64748b; transition: background .15s; }
    .cart-qty-btn:hover { background: #f1f5f9; }
    .cart-qty-num { width: 40px; height: 32px; border: none; border-left: 1.5px solid #e2e8f0; border-right: 1.5px solid #e2e8f0; text-align: center; font-size: 14px; font-weight: 600; color: #0f172a; background: #fff; display: flex; align-items: center; justify-content: center; }
    .cart-remove-btn { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background .15s; white-space: nowrap; }
    .cart-remove-btn:hover { background: rgba(239,68,68,.1); }
    .cart-empty { text-align: center; padding: 3rem 1rem; color: #64748b; }
    .cart-empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .5; }
    .cart-empty-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: .5rem; }
    .cart-empty-text { font-size: 14px; margin-bottom: 1.5rem; }
    .cart-summary { position: sticky; top: 80px; }
    .cart-summary-card { background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%); border-radius: 20px; padding: 1.75rem; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .cart-summary-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 1.25rem; }
    .cart-summary-row { display: flex; justify-content: space-between; align-items: center; padding: .75rem 0; font-size: 14px; color: #475569; border-bottom: 1px solid rgba(0,0,0,.06); }
    .cart-summary-row:last-of-type { border-bottom: none; }
    .cart-summary-row.total { border-top: 2px solid #0f172a; margin-top: .5rem; padding-top: 1rem; font-size: 16px; font-weight: 700; color: #0f172a; }
    .cart-summary-free { color: #16a34a; font-weight: 500; }
    .checkout-btn { width: 100%; background: #0f172a; color: #fff; border: none; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, transform .15s; margin-top: 1.25rem; }
    .checkout-btn:hover { background: #1e293b; transform: translateY(-1px); }
    .checkout-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .cart-secure { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #6b7280; margin-top: 1rem; }

    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; }
      .cart-summary { position: static; }
    }
    @media (max-width: 480px) {
      .cart-page { padding: 1.25rem 1rem 3rem; }
      .cart-title { font-size: 1.5rem; margin-bottom: 1.25rem; }
      .cart-item { flex-wrap: wrap; gap: 0.75rem; }
      .cart-item-img { width: 80px; height: 80px; }
      .cart-item-actions { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; margin-top: 4px; }
      .cart-qty-btn { width: 40px; height: 40px; }
      .cart-qty-num { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <!--
    =======================================
    Navigation Bar
    =======================================
  -->
  <div id="shared-header"></div>

  <!--
    =======================================
    Main Content Area
    =======================================
  -->
  <main class="cart-page">
    <div class="cart-container">
      <a href="index.html" class="cart-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Continue Shopping
      </a>

      <h1 class="cart-title">Shopping Cart</h1>

      <div class="cart-layout">
        <div id="cart-items" class="cart-items" aria-label="Cart items"></div>

        <aside class="cart-summary" aria-label="Order summary">
          <div class="cart-summary-card">
            <h2 class="cart-summary-title">Order Summary</h2>
            <div class="cart-summary-row">
              <span id="cart-item-count">Subtotal (0 items)</span>
              <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="cart-summary-row">
              <span>Shipping</span>
              <span class="cart-summary-free">Free shipping</span>
            </div>
            <div class="cart-summary-row total">
              <span>Total</span>
              <span id="cart-total">$0.00</span>
            </div>
            <button id="checkout-btn" class="checkout-btn" onclick="window.location.href='checkout.html'" disabled>
              Proceed to Checkout
            </button>
            <p class="cart-secure">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Secure checkout · SSL encrypted
            </p>
          </div>
        </aside>
      </div>
    </div>
  </main>

   <!--
    =======================================
    Footer
    =======================================
  -->
  <div id="shared-footer"></div>

   <!-- Scripts -->
  <script src="../js/cart.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/shared.js"></script>

  <script>
    function renderCartUI() {
      const items = cart.getItems();
      const cartEl = document.getElementById('cart-items');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (!items.length) {
        cartEl.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty-icon">🛒</div>
            <div class="cart-empty-title">Your cart is empty</div>
            <p class="cart-empty-text">Browse our collection and add some pieces you love.</p>
            <a href="page1-marine.html" style="background:#0f172a;color:#fff;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;display:inline-block;">Browse Collection</a>
          </div>`;
        checkoutBtn.disabled = true;
        checkoutBtn.style.opacity = '.5';
        document.getElementById('cart-item-count').textContent = 'Subtotal (0 items)';
        document.getElementById('cart-subtotal').textContent = '$0.00';
        document.getElementById('cart-total').textContent = '$0.00';
        return;
      }

      cartEl.innerHTML = items.map(item => `
        <article class="cart-item" data-id="${item.id}">
          <div class="cart-item-img"><img src="${item.image}" alt="${item.title}" loading="lazy"></div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.title}</div>
            <div class="cart-item-subtitle">Cast Sculpture · Australia Made</div>
            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-qty-control">
              <button class="cart-qty-btn qty-minus" data-id="${item.id}" aria-label="Decrease quantity">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="cart-qty-num">${item.quantity}</span>
              <button class="cart-qty-btn qty-plus" data-id="${item.id}" aria-label="Increase quantity">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <button class="cart-remove-btn" data-id="${item.id}" aria-label="Remove ${item.title}">Remove</button>
          </div>
        </article>`).join('');

      // Bind qty and remove buttons
      cartEl.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = +btn.dataset.id;
          const item = cart.getItems().find(i => i.id === id);
          if (item && item.quantity > 1) { cart.updateQuantity(id, item.quantity - 1); renderCartUI(); }
          else { cart.removeItem(id); renderCartUI(); }
        });
      });
      cartEl.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = +btn.dataset.id;
          const item = cart.getItems().find(i => i.id === id);
          if (item) { cart.updateQuantity(id, item.quantity + 1); renderCartUI(); }
        });
      });
      cartEl.querySelectorAll('.cart-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => { cart.removeItem(+btn.dataset.id); renderCartUI(); });
      });

      const totalQty = items.reduce((s, i) => s + i.quantity, 0);
      const subtotal = items.reduce((s, i) => s + i.price * i.quantity, 0);
      document.getElementById('cart-item-count').textContent = `Subtotal (${totalQty} item${totalQty !== 1 ? 's' : ''})`;
      document.getElementById('cart-subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('cart-total').textContent = `$${subtotal.toFixed(2)}`;
      checkoutBtn.disabled = false;
      checkoutBtn.style.opacity = '1';

      if (typeof CartUtils !== 'undefined') CartUtils.updateCartBadge();
    }

    document.addEventListener('DOMContentLoaded', renderCartUI);
  </script>
</body>
</html>
