<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FOOT Artworks</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .login-page {
      min-height: calc(100vh - 64px);
      background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .login-card {
      background: #fff; border-radius: 20px;
      padding: 2.5rem 2rem; width: 100%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .login-logo { text-align: center; margin-bottom: 1.5rem; }
    .login-logo img { width: 40px; height: 48px; object-fit: contain; margin: 0 auto; }
    .login-logo-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #0f172a; display: block; margin-top: 6px; }
    .login-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; text-align: center; color: #0f172a; margin-bottom: .375rem; }
    .login-subtitle { text-align: center; font-size: .875rem; color: #6b7280; margin-bottom: 1.75rem; }

    /* Tabs */
    .login-tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; }
    .login-tab { flex: 1; text-align: center; padding: .625rem; font-size: .9rem; font-weight: 600; color: #94a3b8; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s; }
    .login-tab.active { color: #0f172a; border-color: #0f172a; }

    /* Forms */
    .login-form-section { display: none; }
    .login-form-section.active { display: block; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: .8125rem; font-weight: 600; color: #374151; margin-bottom: .375rem; }
    .form-input {
      width: 100%; padding: .65rem .875rem; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: .9rem; color: #0f172a; background: #fff;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus { border-color: #7dd3fc; box-shadow: 0 0 0 3px rgba(125,211,252,.2); }
    .form-input.error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.12); }
    .form-error { font-size: .75rem; color: #ef4444; margin-top: .25rem; display: none; }
    .form-hint { font-size: .75rem; color: #94a3b8; margin-top: .25rem; }
    .forgot-link { display: block; text-align: right; font-size: .8rem; color: #0369a1; margin-top: .375rem; text-decoration: underline; text-underline-offset: 2px; transition: color .15s; }
    .forgot-link:hover { color: #0284c7; }

    /* Submit button */
    .login-btn {
      width: 100%; padding: .875rem; border-radius: 10px; border: none;
      background: #0f172a; color: #fff; font-size: .9375rem; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .15s; margin-top: .5rem;
    }
    .login-btn:hover { background: #1e293b; transform: translateY(-1px); }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Divider */
    .login-divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: #94a3b8; font-size: .8rem; }
    .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

    /* Social */
    .social-btn {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: .75rem; border-radius: 10px; border: 1.5px solid #e2e8f0;
      background: #fff; font-size: .9rem; font-weight: 500; color: #374151;
      cursor: pointer; margin-bottom: .625rem; transition: background .15s, border-color .15s;
    }
    .social-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .login-switch { text-align: center; font-size: .85rem; color: #6b7280; margin-top: 1.25rem; }
    .login-switch-link { color: #0369a1; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .login-switch-link:hover { color: #0284c7; }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <main class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="../images/IMG_0625.png" alt="FOOT Logo">
        <span class="login-logo-text">FOOT</span>
      </div>

      <div class="login-tabs" role="tablist" aria-label="Login or Register">
        <button class="login-tab active" role="tab" aria-selected="true" aria-controls="tab-login" id="tab-btn-login">Login</button>
        <button class="login-tab" role="tab" aria-selected="false" aria-controls="tab-register" id="tab-btn-register">Register</button>
      </div>

      <!-- Login form -->
      <section class="login-form-section active" id="tab-login" role="tabpanel" aria-labelledby="tab-btn-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email address</label>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="email">
            <span class="form-error" id="err-login-email">Please enter a valid email address</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password">
            <span class="form-error" id="err-login-password">Please enter your password</span>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="login-btn" id="login-submit-btn">Sign In</button>
        </form>

        <div class="login-divider">or continue with</div>
        <button type="button" class="social-btn" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 10.772v2.652h3.636c-.144.945-.546 1.744-1.163 2.271v1.886h1.88c1.1-1.014 1.734-2.507 1.734-4.28 0-.417-.038-.82-.107-1.208L12 10.772z" fill="#4285F4"/><path d="M12 18.545c1.822 0 3.353-.605 4.47-1.637l-1.88-1.459c-.604.406-1.378.646-2.59.646-1.992 0-3.682-1.345-4.285-3.153H5.78v1.505A6.74 6.74 0 0 0 12 18.545z" fill="#34A853"/><path d="M7.715 12.942a4.068 4.068 0 0 1 0-2.584V8.853H5.78A6.74 6.74 0 0 0 5.064 12a6.74 6.74 0 0 0 .716 3.147l1.935-1.505z" fill="#FBBC05"/><path d="M12 8.205c1.122 0 2.13.386 2.922 1.143l2.19-2.19C15.35 5.92 13.82 5.25 12 5.25A6.74 6.74 0 0 0 5.78 8.853l1.935 1.505C8.318 8.55 10.008 8.205 12 8.205z" fill="#EA4335"/></svg>
          Sign in with Google
        </button>
        <button type="button" class="social-btn" aria-label="Sign in with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Sign in with Apple
        </button>
        <p class="login-switch">Don't have an account? <span class="login-switch-link" id="switch-to-register">Register</span></p>
      </section>
