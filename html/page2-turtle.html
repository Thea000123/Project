<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turtles — FOOT</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary-bg: #c1e4e0; --filter-active: #8ce8df; --cart-btn-color: #89c7d6; }
    .hero {
      position: relative; width: 100%; min-height: 700px;
      background: url('../images/image 3.png') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between; padding: 30px 0 50px 0;
    }
    .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.1) 0%, rgba(0,0,0,.5) 100%); }
    .back-btn {
      position: absolute; top: 30px; left: 50px;
      color: #fff; font-size: 24px; z-index: 10; text-decoration: none;
    }
    .hero h1 { position: relative; z-index: 10; color: #fff; font-family: 'Playfair Display',serif; font-size: 54px; font-weight: 500; letter-spacing: 1px; text-align: center; margin-top: auto; }
    .main-content { background-color: var(--primary-bg); padding-bottom: 60px; }
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 30px 20px; max-width: 900px; margin: 0 auto; }
    .filter-btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 20px; border-radius: 22px; background: #fff; border: none; font-family: 'Playfair Display',serif; font-size: 15px; font-weight: 600; color: #333; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,.1); text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
    .filter-btn.active { background: var(--filter-active); color: #fff; }
    .filter-btn:hover:not(.active) { background: #f0f0f0; }
    .grid-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 40px; }
    .product-card { background: #fff; border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,.05); cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(0,0,0,.1); }
    .product-image { width: 100%; height: 220px; background: #f9f9f9; padding: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .product-image img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .3s; }
    .product-card:hover .product-image img { transform: scale(1.05); }
    .cart-btn { position: absolute; right: 14px; top: 185px; width: 42px; height: 42px; background: var(--cart-btn-color); border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #222; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,.15); opacity: 0; transition: opacity .2s, transform .2s; z-index: 2; }
    .product-card:hover .cart-btn { opacity: 1; }
    .cart-btn:hover { background: #5bb8cc; transform: scale(1.08); }
    .product-info { padding: 28px 16px 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-family: 'Playfair Display',serif; font-size: 15px; font-weight: 600; text-transform: uppercase; line-height: 1.4; margin-bottom: 10px; }
    .product-price { font-size: 18px; font-weight: 500; color: #444; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 14px; font-weight: 500; padding: 10px 0; }
    .pg-arrow { cursor: pointer; color: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 6px; transition: background .15s; user-select: none; display: flex; align-items: center; }
    .pg-arrow:hover { background: rgba(255,255,255,.2); }
    .pg-arrow.disabled { opacity: .35; pointer-events: none; }
    .page-num { cursor: pointer; color: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 6px; transition: background .15s, color .15s; }
    .page-num:hover { color: #fff; background: rgba(255,255,255,.2); }
    .page-num.active { color: #fff; font-weight: 700; background: rgba(255,255,255,.25); }
    @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } .hero { min-height: 300px; } }
    @media (max-width: 480px) {
      .hero h1 { font-size: 32px; }
      .back-btn { left: 16px; top: 30px; }
      .hero { min-height: 260px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .grid-container { padding: 0 12px; }
      .product-image { height: 130px; padding: 10px; }
      .cart-btn { top: 95px; right: 8px; width: 34px; height: 34px; opacity: 1; }
      .product-info { padding: 14px 10px 10px; }
      .product-title { font-size: 11px; margin-bottom: 6px; }
      .product-price { font-size: 14px; }
      .filters { padding: 20px 12px; overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; scrollbar-width: none; }
      .filters::-webkit-scrollbar { display: none; }
      .filter-btn { flex-shrink: 0; min-width: 80px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="hero">
    <a href="main.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <h1>Turtle</h1>
  </div>

  <div class="main-content">
    <nav class="filters" aria-label="Category filters">
      <a href="page1-marine.html" class="filter-btn">All</a>
      <button class="filter-btn active">Turtles</button>
      <button class="filter-btn">Dolphins</button>
      <button class="filter-btn">Reef</button>
      <button class="filter-btn">Whales</button>
      <button class="filter-btn">Fish</button>
      <button class="filter-btn">Seahorse</button>
      <button class="filter-btn">Sealions</button>
    </nav>

    <div class="grid-container">
      <div class="product-grid" id="product-grid" role="list" aria-label="Turtle products"></div>
      <nav class="pagination" aria-label="Product pages">
        <span class="pg-arrow" id="pg-prev" role="button" tabindex="0" aria-label="Previous page">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </span>
        <span class="page-num active" data-page="1">1</span>
        <span class="page-num" data-page="2">2</span>
        <span class="pg-arrow" id="pg-next" role="button" tabindex="0" aria-label="Next page">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </nav>
    </div>
  </div>

  <div id="shared-footer"></div>

  <script src="../js/cart.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/shared.js"></script>
  <script>
    (function () {
      const TURTLE_PRODUCTS = [
        { id: 201, title: 'TURTLE MINI COLOURED', price: 215,  image: '../images/image 17.png' },
        { id: 202, title: 'TURTLE MARBLE',         price: 585,  image: '../images/image 18.png' },
        { id: 203, title: 'TURTLE 14 CARAT',       price: 3850, image: '../images/image 19.png' },
        { id: 204, title: 'TURTLE MINI AQUA',      price: 215,  image: '../images/image 20.png' },
        { id: 205, title: 'TURTLE RELIEF',         price: 215,  image: '../images/image 27.png' },
        { id: 206, title: 'TURTLE ALLOY',          price: 585,  image: '../images/image 28.png' },
        { id: 207, title: 'TURTLE COLOURED',       price: 415,  image: '../images/image 29.png' },
        { id: 208, title: 'TURTLE JADE CAST',      price: 415,  image: '../images/image 30.png' },
        { id: 209, title: 'TURTLE MINI PAINTED',   price: 215,  image: '../images/image 17.png' },
        { id: 210, title: 'TURTLE NATURAL',        price: 585,  image: '../images/image 18.png' },
        { id: 211, title: 'TURTLE CARAT GOLD',     price: 3850, image: '../images/image 19.png' },
        { id: 212, title: 'TURTLE AQUA BLUE',      price: 215,  image: '../images/image 20.png' },
        { id: 213, title: 'TURTLE WALL RELIEF',    price: 215,  image: '../images/image 27.png' },
        { id: 214, title: 'TURTLE BRONZE ALLOY',   price: 585,  image: '../images/image 28.png' },
        { id: 215, title: 'TURTLE PAINTED CAST',   price: 415,  image: '../images/image 29.png' },
        { id: 216, title: 'TURTLE JADE GREEN',     price: 415,  image: '../images/image 30.png' },
      ];
      const PER_PAGE = 8;
      let currentPage = 1;
      const totalPages = Math.ceil(TURTLE_PRODUCTS.length / PER_PAGE);
      function fmt(p) { return '$' + p.toLocaleString('en-AU', { minimumFractionDigits: 2 }); }
      function renderGrid(page) {
        const grid = document.getElementById('product-grid');
        const items = TURTLE_PRODUCTS.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        grid.innerHTML = items.map(p => `
          <article class="product-card" role="listitem"
            data-id="${p.id}" data-title="${p.title}" data-price="${p.price}" data-image="${p.image}"
            onclick="window.location.href='product-3.html'">
            <div class="product-image"><img src="${p.image}" alt="${p.title}" loading="lazy"></div>
            <button class="cart-btn" aria-label="Add ${p.title} to cart">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </button>
            <div class="product-info">
              <div class="product-title">${p.title}</div>
              <div class="product-price">${fmt(p.price)}</div>
            </div>
          </article>`).join('');
        grid.querySelectorAll('.cart-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const card = btn.closest('.product-card');
            CartUtils.addToCart({ id: +card.dataset.id, title: card.dataset.title, price: +card.dataset.price, image: card.dataset.image });
            Toast.show(card.dataset.title + ' added to cart', 'success');
          });
        });
      }
      function updatePager(page) {
        document.querySelectorAll('.page-num').forEach(el => el.classList.toggle('active', +el.dataset.page === page));
        document.getElementById('pg-prev').classList.toggle('disabled', page === 1);
        document.getElementById('pg-next').classList.toggle('disabled', page === totalPages);
      }
      function goTo(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page; renderGrid(currentPage); updatePager(currentPage);
      }
      window.addEventListener('load', () => {
        renderGrid(1); updatePager(1);
        document.getElementById('pg-prev').addEventListener('click', () => goTo(currentPage - 1));
        document.getElementById('pg-next').addEventListener('click', () => goTo(currentPage + 1));
        document.querySelectorAll('.page-num').forEach(el => el.addEventListener('click', () => goTo(+el.dataset.page)));
      });
    })();
  </script>
</body>
</html>
