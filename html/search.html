<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foot's Artwork — Search</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/search.css">
</head>
<body>
  <div id="shared-header"></div>

  <main>
    <section class="search-page-bg">
      <div class="search-topbar">
        <button class="search-back-btn" onclick="history.length>1?history.back():window.location.href='index.html'" aria-label="Go back">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="search-page-title">Search</h1>
        <div class="search-inline-box">
          <svg class="search-inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="inline-search-input" placeholder="Search" autocomplete="off" aria-label="Search products">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
      </div>

      <div class="search-layout">
        <aside class="search-sidebar" aria-label="Filters">
          <div class="filter-group">
            <div class="filter-header" role="button" tabindex="0" aria-expanded="true">
              SEARCH HISTORY
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <ul class="history-list" aria-label="Search history">
                <li>turtle bronze</li>
                <li>marble statues</li>
                <li class="clear-history">Clear History</li>
              </ul>
              <div class="filter-divider"></div>
            </div>
          </div>

          <h3 class="filter-main-title">Filter</h3>

          <div class="filter-group">
            <div class="filter-header" role="button" tabindex="0">
              PRICE (A$)
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="price" value="100-200"><span>100–200</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="200-600"><span>200–600</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="600-1000"><span>600–1000</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="1000+"><span>1000+</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-header" role="button" tabindex="0">
              MATERIAL
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="material" value="Cast Marble"><span>Cast Marble</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Bronze"><span>Bronze</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Alloy"><span>Alloy</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Natural Marble"><span>Natural Marble</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-header" role="button" tabindex="0">
              SHIPMENTS
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="shipment" value="Standard"><span>Standard</span></label>
              <label class="filter-option"><input type="checkbox" name="shipment" value="Express"><span>Express</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-header" role="button" tabindex="0">
              AVAILABILITY
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="availability" value="In Stock"><span>In Stock</span></label>
              <label class="filter-option"><input type="checkbox" name="availability" value="Made to Order"><span>Made to Order</span></label>
            </div>
          </div>

          <div class="filter-actions">
            <button class="filter-btn reset-btn" id="filter-reset">Reset</button>
            <button class="filter-btn apply-btn" id="filter-apply">Apply</button>
          </div>
        </aside>

        <div class="product-zone">
          <div id="product-grid" class="products-grid" role="list" aria-label="Products"></div>
          <nav class="pagination-bar" aria-label="Product pages">
            <button class="pg-arrow-btn" id="pg-prev" aria-label="Previous page">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="pg-num active" data-page="1">1</span>
            <span class="pg-num" data-page="2">2</span>
            <button class="pg-arrow-btn" id="pg-next" aria-label="Next page">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <div id="shared-footer"></div>

  <script src="../js/cart.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
