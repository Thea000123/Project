<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot's Artwork - Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
    .search-page-bg{background:linear-gradient(180deg,#fff 0%,#dff0fb 18%,#dff0fb 100%);min-height:100vh;padding:2.5rem 1.5rem 4rem}
    .search-topbar{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 2rem;position:relative}
    .search-back-btn{background:none;border:none;cursor:pointer;color:#1e293b;padding:6px;border-radius:8px;transition:background .15s;flex-shrink:0}
    .search-back-btn:hover{background:rgba(0,0,0,.06)}
    .search-page-title{font-family:'Playfair Display',serif;font-size:2.25rem;font-weight:400;color:#0f172a;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
    .search-inline-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cbd5e1;border-radius:999px;padding:8px 16px 8px 14px;width:240px}
    .search-inline-box input{border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:14px;width:100%;color:#334155}
    .search-inline-box input::placeholder{color:#94a3b8}
    .search-inline-icon{color:#64748b;flex-shrink:0}
    .search-meta{max-width:1100px;margin:0 auto 1.5rem}
    .search-meta h2{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400;color:#1e293b;margin-bottom:4px}
    .search-meta p{font-size:13px;color:#64748b}
    .search-layout{max-width:1100px;margin:0 auto;background:linear-gradient(160deg,#ceedfb 0%,#b8e3f6 100%);border-radius:28px;padding:36px 36px 40px;display:flex;gap:36px}
    .search-sidebar{width:160px;flex-shrink:0}
    .filter-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.07);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#1e293b;cursor:pointer;user-select:none;transition:color .15s}
    .filter-row:last-child{border-bottom:none}
    .filter-row:hover{color:#0369a1}
    .product-zone{flex:1}
    .products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:860px){.products-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.search-layout{flex-direction:column;padding:20px;gap:20px}.search-sidebar{width:100%}.products-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
    .prod-card{background:#fff;border-radius:20px;padding:20px 18px 18px;position:relative;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .prod-card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.10)}
    .prod-card-img{height:148px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
    .prod-card-img img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));transition:transform .22s ease}
    .prod-card:hover .prod-card-img img{transform:scale(1.05)}
    .prod-card-name{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#0f172a;line-height:1.35;padding-right:44px;margin-bottom:6px}
    .prod-card-price{font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#0f172a}
    .prod-cart-btn{position:absolute;right:14px;bottom:18px;width:38px;height:38px;border-radius:50%;background:#7dd3fc;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#0c4a6e;transition:background .18s,transform .18s}
    .prod-cart-btn:hover{background:#38bdf8;transform:scale(1.08)}
    .prod-cart-btn:active{transform:scale(.96)}
    .pagination-bar{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:32px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:#475569}
    .pg-arrow-btn{background:rgba(255,255,255,.5);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#334155;transition:background .15s}
    .pg-arrow-btn:hover{background:rgba(255,255,255,.85)}
    .pg-num{cursor:pointer;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
    .pg-num:hover{background:rgba(255,255,255,.6)}
    .pg-num.active{background:#0ea5e9;color:#fff}
    @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .prod-card{animation:cardIn .4s ease both}

    /* ── Sidebar filter styles ── */
    .filter-main-title{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#1e293b;margin:16px 0 8px}
    .filter-group{margin-bottom:4px}
    .filter-header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#1e293b;cursor:pointer;user-select:none;transition:color .15s}
    .filter-header:hover{color:#0369a1}
    .filter-header svg{transition:transform .2s;flex-shrink:0}
    .filter-group.active .filter-header svg{transform:rotate(180deg)}
    .filter-content{display:none;padding:8px 0 4px}
    .filter-group.active .filter-content{display:block}
    .filter-option{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;color:#475569;cursor:pointer}
    .filter-option input{width:13px;height:13px;accent-color:#0ea5e9;flex-shrink:0}
    .filter-divider{height:1px;background:rgba(0,0,0,.06);margin:8px 0}
    .filter-actions{display:flex;gap:8px;margin-top:14px}
    .filter-btn{flex:1;padding:7px 0;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:background .15s}
    .reset-btn{background:rgba(255,255,255,.5);color:#475569}
    .reset-btn:hover{background:rgba(255,255,255,.8)}
    .apply-btn{background:#0ea5e9;color:#fff}
    .apply-btn:hover{background:#0284c7}

    /* ── Search history styles ── */
    .history-list{list-style:none;padding:0;margin:0}
    .history-list li{padding:4px 0;font-size:11px;color:#64748b;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.04)}
    .history-list .history-item:hover{color:#0369a1}
    .history-list .clear-history{color:#ef4444;font-size:10px;margin-top:4px;border:none}
    .history-list .clear-history:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <main>
    <section class="search-page-bg">
      <div class="search-topbar">
        <button class="search-back-btn" onclick="history.length>1?history.back():window.location.href='main.html'" aria-label="Go back">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="search-page-title">Search</h1>
        <div class="search-inline-box">
          <svg class="search-inline-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="inline-search-input" placeholder="Search" autocomplete="off">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
      </div>

      <div class="search-layout">
        <aside class="search-sidebar">
          <!-- Search History -->
          <div class="filter-group">
            <div class="filter-header">
              SEARCH HISTORY
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <ul class="history-list">
                <li>turtle bronze</li>
                <li>marble statues</li>
                <li class="clear-history">Clear History</li>
              </ul>
              <div class="filter-divider"></div>
            </div>
          </div>

          <h3 class="filter-main-title">Filter</h3>

          <!-- Price -->
          <div class="filter-group">
            <div class="filter-header">
              PRICE (A$)
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="price" value="100-200"><span>100-200</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="200-600"><span>200-600</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="600-1000"><span>600-1000</span></label>
              <label class="filter-option"><input type="checkbox" name="price" value="1000+"><span>1000+</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <!-- Material -->
          <div class="filter-group">
            <div class="filter-header">
              MATERIAL
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="material" value="Cast Marble"><span>Cast Marble</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Bronze"><span>Bronze</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Alloy"><span>Alloy</span></label>
              <label class="filter-option"><input type="checkbox" name="material" value="Natural Marble"><span>Natural Marble</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <!-- Shipments -->
          <div class="filter-group">
            <div class="filter-header">
              SHIPMENTS
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="shipment" value="Standard"><span>Standard</span></label>
              <label class="filter-option"><input type="checkbox" name="shipment" value="Express"><span>Express</span></label>
              <div class="filter-divider"></div>
            </div>
          </div>

          <!-- Availability -->
          <div class="filter-group">
            <div class="filter-header">
              AVAILABILITY
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="filter-content">
              <label class="filter-option"><input type="checkbox" name="availability" value="In Stock"><span>In Stock</span></label>
              <label class="filter-option"><input type="checkbox" name="availability" value="Made to Order"><span>Made to Order</span></label>
            </div>
          </div>

          <!-- bottom buttons -->
          <div class="filter-actions">
            <button class="filter-btn reset-btn">Reset</button>
            <button class="filter-btn apply-btn">Apply</button>
          </div>
        </aside>

        <div class="product-zone">
          <div id="product-grid" class="products-grid"></div>
          <div class="pagination-bar">
            <button class="pg-arrow-btn" id="pg-prev" aria-label="Previous">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="pg-num active" data-page="1">1</span>
            <span class="pg-num" data-page="2">2</span>
            <button class="pg-arrow-btn" id="pg-next" aria-label="Next">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="shared-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shared.js"></script>

  <script>
    // Product data (reuse PRODUCTS from shared.js if avalible)
    const ALL_PRODUCTS = [
      { id:1, title:'TURTLE MINI COLOURED',  price:215.0,  image:'images/image 17.png',  material:'Cast Marble' },
      { id:2, title:'TURTLE MARBLE',          price:585.0,  image:'images/image 18.png',  material:'Cast Marble' },
      { id:3, title:'TURTLE 14 CARAT',        price:3850.0, image:'images/image 19.png',  material:'Natural Marble' },
      { id:4, title:'TURTLE RELIEF',          price:215.0,  image:'images/image 20.png',  material:'Alloy' },
      { id:5, title:'TURTLE ALLOY',           price:585.0,  image:'images/image 27.png',  material:'Alloy' },
      { id:6, title:'TURTLE MINI AQUA',       price:215.0,  image:'images/image 28.png',  material:'Cast Marble' },
      { id:7, title:'TURTLE COLOURED',        price:415.0,  image:'images/image 29.png',  material:'Cast Marble' },
      { id:8, title:'TURTLE GOLD BRONZE',     price:445.0,  image:'images/image 30.png',  material:'Bronze' },
      { id:9, title:'TURTLE JADE CAST',       price:415.0,  image:'images/image 31.png',  material:'Cast Marble' },
      { id:2, title:'TURTLE MARBLE (B)',       price:585.0,  image:'images/image 18.png',  material:'Cast Marble' },
      { id:1, title:'TURTLE MINI COLOURED (B)',price:215.0,  image:'images/image 17.png',  material:'Cast Marble' },
      { id:4, title:'TURTLE RELIEF (B)',       price:215.0,  image:'images/image 20.png',  material:'Alloy' }
    ].map((p, i) => ({...p, uid: i + 1}));

    const PER_PAGE = 6;
    let curPage = 1;
    let shown = [...ALL_PRODUCTS];

    // ── Render product grid ──
    function renderGrid() {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      const slice = shown.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);
      if (slice.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#64748b;padding:2rem;">No products found.</p>';
        return;
      }
      grid.innerHTML = slice.map((p, i) => `
        <article class="prod-card" style="animation-delay:${i * .06}s"
          onclick="window.location.href='product-${p.id}.html'"
          role="button" tabindex="0" aria-label="View ${p.title}">
          <div class="prod-card-img"><img src="${p.image}" alt="${p.title}" loading="lazy"></div>
          <div class="prod-card-name">${p.title}</div>
          <div class="prod-card-price">$${p.price.toFixed(2)}</div>
          <button class="prod-cart-btn"
            onclick="event.stopPropagation();CartUtils&&CartUtils.addToCart({id:${p.id},title:'${p.title.replace(/'/g,"\'")}',price:${p.price},image:'${p.image}'}),Toast&&Toast.show('${p.title.replace(/'/g,"\'")} added to cart','success')"
            aria-label="Add ${p.title} to cart">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
          </button>
        </article>`).join('');
    }

    // ── Dynamic pagination ──
    function refreshPager() {
      const totalPages = Math.ceil(shown.length / PER_PAGE);
      const bar = document.querySelector('.pagination-bar');
      if (!bar) return;

      // Rebuild page number buttons dynamically
      const prevBtn = document.getElementById('pg-prev');
      const nextBtn = document.getElementById('pg-next');

      // Remove old page number spans
      bar.querySelectorAll('.pg-num').forEach(el => el.remove());

      // Insert new ones between prev and next
      for (let i = 1; i <= totalPages; i++) {
        const span = document.createElement('span');
        span.className = 'pg-num' + (i === curPage ? ' active' : '');
        span.dataset.page = i;
        span.textContent = i;
        span.addEventListener('click', () => { curPage = i; renderGrid(); refreshPager(); });
        bar.insertBefore(span, nextBtn);
      }

      if (prevBtn) prevBtn.disabled = curPage === 1;
      if (nextBtn) nextBtn.disabled = curPage === totalPages;
    }

    // ── Update meta text ──
    function updateMeta(query) {
      const titleEl = document.getElementById('search-result-title');
      const countEl = document.getElementById('search-result-count');
      if (titleEl) titleEl.innerHTML = query ? `Result for &lsquo;${query}&rsquo;` : 'All Products';
      if (countEl) countEl.textContent = `${shown.length} relevant result${shown.length !== 1 ? 's' : ''} found`;
    }

    // ── Search history helpers ──
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem('search-history') || '[]'); } catch(e) { return []; }
    }
    function saveHistory(q) {
      if (!q) return;
      let h = loadHistory().filter(x => x !== q);
      h.unshift(q);
      h = h.slice(0, 8);
      try { localStorage.setItem('search-history', JSON.stringify(h)); } catch(e) {}
    }
    function renderHistory() {
      const list = document.querySelector('.history-list');
      if (!list) return;
      const h = loadHistory();
      const items = h.map(q => `<li class="history-item" data-q="${q}">${q}</li>`).join('');
      list.innerHTML = items + '<li class="clear-history">Clear History</li>';

      list.querySelectorAll('.history-item').forEach(li => {
        li.addEventListener('click', () => {
          const inp = document.getElementById('inline-search-input');
          if (inp) { inp.value = li.dataset.q; inp.dispatchEvent(new Event('input')); }
        });
      });
      const clearBtn = list.querySelector('.clear-history');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          try { localStorage.removeItem('search-history'); } catch(e) {}
          renderHistory();
        });
      }
    }

    // ── Filter logic ──
    function applyFilters() {
      const checkedPrices = [...document.querySelectorAll('input[name="price"]:checked')].map(el => el.value);
      const checkedMaterials = [...document.querySelectorAll('input[name="material"]:checked')].map(el => el.value);
      const query = document.getElementById('inline-search-input')?.value.trim().toLowerCase() || '';

      shown = ALL_PRODUCTS.filter(p => {
        // Text search
        if (query && !p.title.toLowerCase().includes(query)) return false;
        // Price filter
        if (checkedPrices.length) {
          const inPrice = checkedPrices.some(range => {
            if (range === '100-200') return p.price >= 100 && p.price <= 200;
            if (range === '200-600') return p.price > 200 && p.price <= 600;
            if (range === '600-1000') return p.price > 600 && p.price <= 1000;
            if (range === '1000+') return p.price > 1000;
            return false;
          });
          if (!inPrice) return false;
        }
