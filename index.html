<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot's Artwork - Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
    .search-page-bg{background:linear-gradient(180deg,#fff 0%,#dff0fb 18%,#dff0fb 100%);min-height:100vh;padding:2.5rem 1.5rem 4rem}
    .search-topbar{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 2rem;position:relative}
    .search-back-btn{background:none;border:none;cursor:pointer;color:#1e293b;padding:6px;border-radius:8px;transition:background .15s;flex-shrink:0}
    .search-back-btn:hover{background:rgba(0,0,0,.06)}
    .search-page-title{font-family:'Playfair Display',serif;font-size:2.25rem;font-weight:400;color:#0f172a;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
    .search-inline-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cbd5e1;border-radius:999px;padding:8px 16px 8px 14px;width:240px}
    .search-inline-box input{border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:14px;width:100%;color:#334155}
    .search-inline-box input::placeholder{color:#94a3b8}
    .search-inline-icon{color:#64748b;flex-shrink:0}
    .search-meta{max-width:1100px;margin:0 auto 1.5rem}
    .search-meta h2{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400;color:#1e293b;margin-bottom:4px}
    .search-meta p{font-size:13px;color:#64748b}
    .search-layout{max-width:1100px;margin:0 auto;background:linear-gradient(160deg,#ceedfb 0%,#b8e3f6 100%);border-radius:28px;padding:36px 36px 40px;display:flex;gap:36px}
    .search-sidebar{width:160px;flex-shrink:0}
    .filter-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.07);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#1e293b;cursor:pointer;user-select:none;transition:color .15s}
    .filter-row:last-child{border-bottom:none}
    .filter-row:hover{color:#0369a1}
    .product-zone{flex:1}
    .products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:860px){.products-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.search-layout{flex-direction:column;padding:20px;gap:20px}.search-sidebar{width:100%}.products-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
    .prod-card{background:#fff;border-radius:20px;padding:20px 18px 18px;position:relative;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .prod-card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.10)}
    .prod-card-img{height:148px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
    .prod-card-img img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));transition:transform .22s ease}
    .prod-card:hover .prod-card-img img{transform:scale(1.05)}
    .prod-card-name{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#0f172a;line-height:1.35;padding-right:44px;margin-bottom:6px}
    .prod-card-price{font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#0f172a}
    .prod-cart-btn{position:absolute;right:14px;bottom:18px;width:38px;height:38px;border-radius:50%;background:#7dd3fc;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#0c4a6e;transition:background .18s,transform .18s}
    .prod-cart-btn:hover{background:#38bdf8;transform:scale(1.08)}
    .prod-cart-btn:active{transform:scale(.96)}
    .pagination-bar{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:32px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:#475569}
    .pg-arrow-btn{background:rgba(255,255,255,.5);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#334155;transition:background .15s}
    .pg-arrow-btn:hover{background:rgba(255,255,255,.85)}
    .pg-num{cursor:pointer;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
    .pg-num:hover{background:rgba(255,255,255,.6)}
    .pg-num.active{background:#0ea5e9;color:#fff}
    @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .prod-card{animation:cardIn .4s ease both}


</head>
</html>
