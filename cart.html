<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Shopping Cart — Foot's Artworks</title>
  <meta name="description" content="View and manage your shopping cart items">
  <!-- 
    ================================================
    External Resources Loading
    1. Google Fonts: Inter (body) + Playfair Display (headings)
    2. Internal stylesheet styles.css
    ================================================
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    =======================================
    Navigation Bar
    =======================================
  -->
  <div id="shared-header"></div>

  <!--
    =======================================
    Main Content Area
    =======================================
  -->
  <main class="cart-page">
    <div class="cart-container">
      <!-- 
        =======================================
        Back Link
        Allows user to return to product list and continue shopping
        =======================================
      -->
      <a href="index.html" class="cart-back">
        <!-- Left arrow icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Continue Shopping
      </a>

      <!-- 
        =======================================
        Page Title
        =======================================
      -->
      <h1 class="cart-title">Shopping Cart</h1>

      <!-- 
        =======================================
        Cart Layout
        Two-column layout: left product list + right order summary
        =======================================
      -->
      <div class="cart-layout">
        <!-- 
          =======================================
          Cart Items List
          Dynamically rendered by JavaScript
          =======================================
        -->
        <div id="cart-items" class="cart-items">
          <!-- JavaScript renders cart items here -->
        </div>

        <!-- 
          =======================================
          Order Summary Card
          Shows subtotal, shipping, total and checkout button
          =======================================
        -->
        <div class="cart-summary">
          <div class="cart-summary-card">
            <h2 class="cart-summary-title">Order Summary</h2>

            <!-- 
              =======================================
              Price Details
              Contains subtotal, shipping and total
              =======================================
            -->
            <div class="space-y-3 mb-6">
              <!-- Subtotal row -->
              <div class="cart-summary-row">
                <span id="cart-item-count">Subtotal (0 items)</span>
                <span id="cart-subtotal">$0.00</span>
              </div>
              
              <!-- Shipping row -->
              <div class="cart-summary-row">
                <span>Shipping</span>
                <span class="cart-summary-free">Free shipping</span>
              </div>
              
              <!-- Total row -->
              <div class="cart-summary-row total">
                <span>Total</span>
                <span id="cart-total">$0.00</span>
              </div>
            </div>

            <!-- 
              =======================================
              Checkout Button
              Navigates to checkout page
              =======================================
            -->
            <button id="checkout-btn" class="btn btn-primary btn-block" onclick="window.location.href='checkout.html'">
              Proceed to checkout
            </button>
