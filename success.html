<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Received — FOOT Artworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* 
     * ============================================================
     * Success Page Wrapper
     * Centered display, max width 640px
     * ============================================================
     */
    .success-wrapper {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* 
     * ============================================================
     * Success Hero Section
     * Contains success icon, title and subtitle
     * ============================================================
     */
    .success-hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* 
     * ============================================================
     * Success Icon
     * Green circular background with white checkmark icon
     * ============================================================
     */
    .success-check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-500), var(--green-600));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: bounceIn .6s ease both;
    }

    /* Bounce-in animation */
    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.15); opacity: 1; }
      75% { transform: scale(.95); }
      100% { transform: scale(1); }
    }
