<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Received — FOOT Artworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* 
     * ============================================================
     * Success Page Wrapper
     * Centered display, max width 640px
     * ============================================================
     */
    .success-wrapper {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* 
     * ============================================================
     * Success Hero Section
     * Contains success icon, title and subtitle
     * ============================================================
     */
    .success-hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* 
     * ============================================================
     * Success Icon
     * Green circular background with white checkmark icon
     * ============================================================
     */
    .success-check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-500), var(--green-600));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: bounceIn .6s ease both;
    }

    /* Bounce-in animation */
    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.15); opacity: 1; }
      75% { transform: scale(.95); }
      100% { transform: scale(1); }
    }

    /* Success page heading */
    .success-heading {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: .04em;
      margin-bottom: .5rem;
    }

    /* Success page subtitle */
    .success-sub {
      font-size: .9375rem;
      color: var(--gray-500);
    }

    /* 
     * ============================================================
     * Order Metadata
     * Contains order number, confirmation email, help information
     * ============================================================
     */
    .order-meta {
      background: var(--sky-50);
      border: 1px solid var(--sky-100);
      border-radius: var(--radius-xl);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      font-size: .9375rem;
      color: var(--gray-700);
      animation: fadeInUp .5s ease .1s both;
    }

    /* Fade-in-up animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bold text in order metadata */
    .order-meta strong {
      font-weight: 700;
      color: var(--gray-900);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Links in order metadata */
    .order-meta a {
      font-weight: 600;
      color: var(--sky-700);
    }

     /* Help text */
    .order-meta .meta-help {
      font-size: .8125rem;
      color: var(--gray-400);
      margin-top: .25rem;
    }

    /* 
     * ============================================================
     * Order Card
     * Contains order item list and total price
     * ============================================================
     */
    .order-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
      animation: fadeInUp .5s ease .2s both;
    }

    /* Order card header */
    .order-card-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--gray-100);
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--sky-600);
    }

    /* 
     * ============================================================
     * Order Line Item
     * Contains product image, name, specifications and price
     * ============================================================
     */
    .order-line {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--gray-100);
    }
    .order-line:last-of-type { border-bottom: none; }

    /* Order line image */
    .order-line-img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: var(--stone-50);
      object-fit: contain;
      padding: .375rem;
      flex-shrink: 0;
      border: 1px solid var(--gray-100);
    }

    /* Order line information */
    .order-line-info {
      flex: 1;
      font-size: .9375rem;
      color: var(--gray-700);
      line-height: 1.5;
    }

    /* Order line price */
    .order-line-price {
      font-family: var(--font-serif);
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--sky-700);
      flex-shrink: 0;
    }

    /* 
     * ============================================================
     * Order Total Row
     * Displays order total amount
     * ============================================================
     */
    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-top: 2px solid var(--gray-900);
      background: var(--gray-50);
    }
