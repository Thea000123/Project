<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURTLE COLOURED — Foot's Artworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* 
     * ============================================================
     * Page Layout
     * ============================================================
     */
    .pd-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 4rem;
    }

     /* 
     * ============================================================
     * Breadcrumb Navigation
     * Shows current page location, allows user to return to parent
     * ============================================================
     */
    .pd-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .pd-breadcrumb a {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1e293b;
      text-decoration: none;
      transition: color .15s;
    }
    .pd-breadcrumb a:hover { color: #0369a1; }
    .pd-breadcrumb span { color: #94a3b8; margin: 0 2px; }

    /* 
     * ============================================================
     * Main Layout: Two Columns
     * Left: Image Gallery / Right: Product Information
     * ============================================================
     */
    .pd-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
    }
    @media (max-width: 760px) {
      .pd-layout { grid-template-columns: 1fr; gap: 32px; }
    }

    /* 
     * ============================================================
     * Gallery: Left Thumbnails + Right Main Image
     * ============================================================
     */
    .pd-gallery {
      display: flex;
      gap: 14px;
    }

    /* 
     * ============================================================
     * Left Thumbnail Strip
     * ============================================================
     */
    .pd-thumbs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pd-thumb {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: #f1f5f9;
      overflow: hidden;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .18s, box-shadow .18s;
    }
    .pd-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pd-thumb.active {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 3px rgba(125,211,252,.25);
    }
    .pd-thumb:hover:not(.active) {
      border-color: #cbd5e1;
    }
