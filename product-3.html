<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURTLE COLOURED — Foot's Artworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* 
     * ============================================================
     * Page Layout
     * ============================================================
     */
    .pd-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 4rem;
    }

     /* 
     * ============================================================
     * Breadcrumb Navigation
     * Shows current page location, allows user to return to parent
     * ============================================================
     */
    .pd-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .pd-breadcrumb a {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1e293b;
      text-decoration: none;
      transition: color .15s;
    }
    .pd-breadcrumb a:hover { color: #0369a1; }
    .pd-breadcrumb span { color: #94a3b8; margin: 0 2px; }

    /* 
     * ============================================================
     * Main Layout: Two Columns
     * Left: Image Gallery / Right: Product Information
     * ============================================================
     */
    .pd-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
    }
    @media (max-width: 760px) {
      .pd-layout { grid-template-columns: 1fr; gap: 32px; }
    }

    /* 
     * ============================================================
     * Gallery: Left Thumbnails + Right Main Image
     * ============================================================
     */
    .pd-gallery {
      display: flex;
      gap: 14px;
    }

    /* 
     * ============================================================
     * Left Thumbnail Strip
     * ============================================================
     */
    .pd-thumbs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pd-thumb {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: #f1f5f9;
      overflow: hidden;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .18s, box-shadow .18s;
    }
    .pd-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pd-thumb.active {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 3px rgba(125,211,252,.25);
    }
    .pd-thumb:hover:not(.active) {
      border-color: #cbd5e1;
    }

    /* 
     * ============================================================
     * Main Image Container
     * ============================================================
     */
    .pd-main-wrap {
      flex: 1;
      position: relative;
      background: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pd-main-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      transition: opacity .25s ease;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.15));
    }
    #pd-main-img.fade { opacity: 0; }

    /* 
     * ============================================================
     * Gallery Navigation Buttons
     * ============================================================
     */
    .pd-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.85);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #334155;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      transition: background .15s, transform .15s;
      z-index: 2;
    }
    .pd-nav-btn:hover { background: #fff; transform: translateY(-50%) scale(1.08); }
    .pd-nav-prev { left: 10px; }
    .pd-nav-next { right: 10px; }

    /* 
     * ============================================================
     * Product Information Panel
     * ============================================================
     */
    .pd-info { display: flex; flex-direction: column; gap: 0; }

    /* Product title */
    .pd-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: .5rem;
    }

    /* Product price */
    .pd-price {
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 1.25rem;
    }

    /* Divider */
    .pd-divider { border: none; border-top: 1px solid #e2e8f0; margin-bottom: 1.25rem; }

    /* 
     * ============================================================
     * Accordion Component
     * Collapsible information panels
     * ============================================================
     */
    .pd-accordion { margin-bottom: 1.5rem; }
    .pd-acc-item { border-bottom: 1px solid #e2e8f0; }
    .pd-acc-btn {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .875rem 0;
      font-family: 'Inter', sans-serif;
      font-size: .9375rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
    }
    .pd-acc-btn svg { transition: transform .2s; flex-shrink: 0; }
    .pd-acc-item.open .pd-acc-btn svg { transform: rotate(180deg); }
    .pd-acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease, padding .3s ease;
    }
    .pd-acc-item.open .pd-acc-body { max-height: 200px; }
    .pd-acc-text {
      font-family: 'Inter', sans-serif;
      font-size: .875rem;
      color: #475569;
      line-height: 1.7;
      padding-bottom: 1rem;
    }

    /* 
     * ============================================================
     * Quantity Selector
     * ============================================================
     */
    .pd-qty-label {
      font-family: 'Inter', sans-serif;
      font-size: .8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      margin-bottom: .5rem;
    }
    .pd-qty-row {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      width: fit-content;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .pd-qty-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #334155;
      transition: background .15s;
    }
    .pd-qty-btn:hover { background: #f1f5f9; }
    .pd-qty-input {
      width: 44px;
      height: 40px;
      border: none;
      border-left: 1.5px solid #e2e8f0;
      border-right: 1.5px solid #e2e8f0;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      background: #fff;
    }

    /* 
     * ============================================================
     * Action Buttons
     * Add to Cart / Buy Now
     * ============================================================
     */
    .pd-actions { display: flex; gap: 12px; margin-bottom: 1rem; }

    /* Add to Cart button */
    .pd-btn-cart {
      flex: 1;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-family: 'Inter', sans-serif;
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .18s, transform .15s;
    }
    .pd-btn-cart:hover { background: #1e293b; transform: translateY(-1px); }
    .pd-btn-cart:active { transform: translateY(0); }

    /* Buy Now button */
    .pd-btn-buy {
      flex: 1;
      background: #fff;
      color: #0f172a;
      border: 1.5px solid #0f172a;
      border-radius: 10px;
      padding: 13px 20px;
      font-family: 'Inter', sans-serif;
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .18s, transform .15s;
    }
    .pd-btn-buy:hover { background: #f8fafc; transform: translateY(-1px); }

    /* Shipping info */
    .pd-shipping {
      font-family: 'Inter', sans-serif;
      font-size: .8125rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
